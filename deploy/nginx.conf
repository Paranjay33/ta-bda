# Reverse proxy in front of the API (which also serves the frontend).
# For production, terminate TLS here (add a `listen 443 ssl;` server block with
# your certificate) or at your cloud load balancer, and set CORS_ORIGINS,
# AUTH_REQUIRED=true and API_KEY on the api service.
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
